name: "Antigravity CLI (Custom)"
description: "AI Agent with total control over domotics via Home Assistant Supervisor API"
version: "1.12.1-custom1"
slug: "antigravity_cli"
panel_icon: "mdi:triangle"
panel_title: "Antigravity"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
host_network: true
ingress: true
ingress_port: 62899
panel_icon: mdi:triangle-outline
icon: true
logo: true
map:
  - config:rw
  - share:rw
options:
  ha_token: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: "1883"
  mqtt_user: "addons"
  mqtt_pass: ""
  extra_args: "--remote-control --remote-control-name home-assistant-prod"
schema:
  ha_token: "str?"
  mqtt_host: "str?"
  mqtt_port: "str?"
  mqtt_user: "str?"
  mqtt_pass: "password?"
  extra_args: "str?"

